# ── Stack complète : PostgreSQL + API FastAPI + Frontend Next.js ────────────
# Démarrage :
#   docker compose up -d --build
#   docker compose exec api python -m api.auth.seed     # comptes de démo
# Frontend : http://localhost:3000 · API : http://localhost:8000/api/health
#
# Le secret JWT et le mot de passe PostgreSQL viennent du fichier .env
# (JWT_SECRET_KEY, POSTGRES_PASSWORD) — jamais committés.

services:
  auth-db:
    image: postgres:16
    container_name: finance_auth_db
    environment:
      POSTGRES_DB: finance_auth
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance_pfe_2026}
    ports:
      - "5432:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance_auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: finance_api
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      AUTH_DATABASE_URL: postgresql+psycopg2://finance:${POSTGRES_PASSWORD:-finance_pfe_2026}@auth-db:5432/finance_auth
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY requis (voir .env.example)}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:4000,http://127.0.0.1:4000
    ports:
      - "8000:8000"
    volumes:
      # Entrepôt analytique + sorties persistés hors du conteneur
      - ./output:/app/output
      - ./data_pfe:/app/data_pfe:ro

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    container_name: finance_frontend
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  auth_pgdata:
