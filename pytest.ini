[pytest]
# Configuration de la suite de tests.
#
# Le marqueur `vitrine` désigne les tests à CITER : un par affirmation forte du
# mémoire (isolation des données, résilience de la flotte, absence de fuite
# temporelle, honnêteté du registre, intégrité comptable…). Ils s'exécutent en
# moins de deux minutes, ce qui permet de les lancer devant un jury.
#
#     python -m pytest -m vitrine -v     # les tests emblématiques (liste : docs/TESTS.md)
#     python -m pytest -q                # la suite complète
#     python scripts/tableau_tests.py    # régénère docs/TESTS.md
testpaths = tests
markers =
    vitrine: test emblématique, cité dans le mémoire et rejouable en soutenance
