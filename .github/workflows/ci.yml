# ── Intégration continue — Finance AI Agent ────────────────────────────────
# À chaque push / pull request :
#   1. backend  : dépendances API + suite pytest complète (73+ tests)
#   2. frontend : typecheck TypeScript strict + build Next.js
#   3. docker   : l'image API se construit (validation du Dockerfile)
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend-tests:
    name: Tests backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances
        run: |
          pip install -r requirements-api.txt
          pip install pytest httpx
      - name: Suite de tests (intégrité, flotte, demande, auth, RBAC, portail)
        env:
          JWT_SECRET_KEY: ci-secret-uniquement
        run: python -m pytest tests/ -v --tb=short

  frontend-build:
    name: Typecheck + build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dépendances
        run: npm ci --no-audit --no-fund
      - name: Typecheck strict
        run: npx tsc --noEmit
      - name: Build Next.js
        run: npm run build

  docker-build:
    name: Build image API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer les dossiers d'artefacts (si absents du dépôt)
        run: mkdir -p models reports output
      - name: Build
        run: docker build -t overlyne-api .
